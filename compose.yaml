services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      # Builds the `dev` target. `dev` and `runtime` are *siblings* off the
      # shared `base` stage, not a chain: `dev` adds psql (so `manage.py
      # dbshell` works locally without a psql client in a shipped image) plus
      # `tests/`, `pytest.ini` and `ruff.toml`, while `runtime` adds nothing
      # to `base` at all. Siblings rather than a chain is what makes "no
      # shipped layer ever contains tests/" true by construction — nothing
      # absent was ever copied in and then deleted. (`runtime` is an honest
      # placeholder today, not yet deployable — see the comment on that stage
      # in docker/Dockerfile.)
      target: dev
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      # Local dev only: one container, no rolling deploy, so the entrypoint may
      # migrate on boot and a fresh clone's first `up` serves a real schema.
      # Deploys leave this unset — see docker/entrypoint.sh.
      #
      # Note what putting it here means: `docker compose run --rm web <cmd>`
      # inherits the whole service `environment:`, so every one-off command
      # inherits this permission too. The entrypoint therefore requires *both*
      # this variable and a command it recognises as a server before it will
      # migrate, and refuses outright for a test runner. It stays here rather
      # than moving to `command:` because the point of it is the healthcheck
      # contract above: `up --wait` must mean "migrated and answering".
      RAPORO_AUTO_MIGRATE: "1"
    volumes:
      - ".:/app"
    ports:
      - "8000:8000"
    healthcheck:
      # Same endpoint the deploy probes use. Makes `up --wait` mean "migrated
      # and answering requests" rather than "process started".
      test:
        - CMD
        - python
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 5s
      timeout: 5s
      # retries stays tight: it governs how long an *already-running* app may
      # be sick before compose calls it unhealthy. The cold start is budgeted
      # by start_period instead, which costs nothing when boot is fast because
      # `up --wait` returns on the first success. 120s because a wiped-volume
      # `up` here took 102s to first-healthy (check + 22 migrations + first
      # request) against a 102s budget — zero margin, and slice 2 adds
      # migrations.
      retries: 12
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    env_file: .env
    healthcheck:
      # `-h 127.0.0.1` on purpose: during first-time initdb the server listens
      # on the unix socket only, and a socket-based pg_isready reports ready
      # before the database accepts TCP connections — which is exactly when
      # `web` would try to migrate on a fresh clone.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      retries: 10
      # Same reasoning. A cold `initdb` on a loaded machine was measured at
      # ~30s of real work in this repo; with start_period at 15s the probe
      # failures during it counted against `retries` and `up --wait` aborted
      # the whole stack with "dependency failed to start".
      start_period: 60s
    volumes:
      # `/var/lib/postgresql`, NOT `/var/lib/postgresql/data` — the mount point
      # moved in postgres:18, and this line is the whole reason the image bump
      # above is not a one-word change.
      #
      # Up to and including postgres:17 the image set
      # `PGDATA=/var/lib/postgresql/data` and declared that same path as its
      # VOLUME, so `pgdata:/var/lib/postgresql/data` was the documented mount.
      # postgres:18 made PGDATA major-version-specific
      # (`/var/lib/postgresql/18/docker`) and moved the declared VOLUME up one
      # level, so a future major upgrade can hold 18/ and 19/ side by side in
      # one volume and run `pg_upgrade --link` without crossing a mount
      # boundary.
      #
      # Keeping the old path does not corrupt anything and does not quietly
      # write to an anonymous volume: docker-entrypoint.sh in 18+ checks
      # whether `/var/lib/postgresql/data` is a mount point *at all* —
      # irrespective of contents, so a brand-new empty volume trips it too —
      # and exits 1 with an explicit message ("/var/lib/postgresql/data (unused
      # mount/volume)"). Verified: the container never reaches `pg_isready`, so
      # `up --wait` aborts the stack on the `db` healthcheck. Loud and
      # first-boot, which is why this comment is short on doom and long on the
      # path: get the path right and there is nothing else to know.
      - "pgdata:/var/lib/postgresql"

volumes:
  pgdata: {}
