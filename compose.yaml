services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      - ".:/app"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 3s
      retries: 10
    volumes:
      - "pgdata:/var/lib/postgresql/data"

volumes:
  pgdata: {}
